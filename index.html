<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Todo App</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app">
    <nav class="card menu" aria-label="Main menu">
      <a class="menu-link active" href="index.html" aria-current="page">
        <span class="menu-icon menu-icon-tasks" aria-hidden="true"></span>
        <span>Tasks</span>
      </a>
      <a class="menu-link" href="board.html">
        <span class="menu-icon menu-icon-board" aria-hidden="true"></span>
        <span>Post-it Board</span>
      </a>
    </nav>

    <header class="header hero-header">
      <div>
        <p class="eyebrow">Focus desk</p>
        <h1>Todo</h1>
        <p class="subtitle">A calm command center for priorities, subtasks, and momentum.</p>
      </div>

      <div class="overall-widget" aria-label="Overall progress">
        <div class="progress-orb" id="overall-orb">
          <svg class="progress-orb-ring" viewBox="0 0 120 120" aria-hidden="true">
            <defs>
                <linearGradient id="overall-ring-gradient"
                    x1="0%"
                    y1="0%"
                    x2="100%"
                    y2="100%">

                    <stop offset="0%" stop-color="#39D7FF"/>
                    <stop offset="35%" stop-color="#4A9BFF"/>
                    <stop offset="100%" stop-color="#D85BFF"/>

                </linearGradient>
            </defs>
            <circle class="progress-orb-track" cx="60" cy="60" r="45" pathLength="100"></circle>
            <circle class="progress-orb-fill" id="overall-orb-ring" cx="60" cy="60" r="45" pathLength="100"></circle>
          </svg>
          <span id="overall-orb-value">0%</span>
        </div>
        <span>Overall Progress</span>
      </div>
    </header>

    <section class="dashboard" aria-label="Task dashboard">
      <article class="stat-card">
        <span class="stat-label">Total Tasks</span>
        <strong id="stat-total">0</strong>
      </article>
      <article class="stat-card">
        <span class="stat-label">Active</span>
        <strong id="stat-active">0</strong>
      </article>
      <article class="stat-card">
        <span class="stat-label">Completed</span>
        <strong id="stat-completed">0</strong>
      </article>
      <article class="stat-card accent">
        <span class="stat-label">Overall</span>
        <strong id="stat-overall">0%</strong>
      </article>
    </section>

    <section class="card composer-card" aria-label="Add a new todo">
      <form id="todo-form" class="form" autocomplete="off">
        <label class="sr-only" for="todo-input">New todo</label>
        <input id="todo-input" type="text" placeholder="Add a task..." maxlength="1000" required />
        <button type="submit" class="btn primary">Add</button>
      </form>

      <div class="toolbar">
        <div class="filters" role="tablist" aria-label="Todo filters">
          <button class="chip active" data-filter="all" type="button" role="tab" aria-selected="true">All</button>
          <button class="chip" data-filter="active" type="button" role="tab" aria-selected="false">Active</button>
          <button class="chip" data-filter="completed" type="button" role="tab" aria-selected="false">Completed</button>
        </div>

        <button id="clear-completed" class="btn ghost" type="button">Clear completed</button>
      </div>
    </section>

    <section class="card list-panel" aria-label="Todo list">
      <div class="meta">
        <span id="count">0 items</span>
        <button id="toggle-all" class="btn ghost" type="button" title="Toggle all">Toggle all</button>
      </div>

      <ul id="todo-list" class="list" aria-live="polite"></ul>

      <p id="empty" class="empty">No todos yet. Add one above.</p>
    </section>

  </main>

  <template id="todo-item-template">
    <li class="item">
      <div class="row top">
        <div class="check-wrap">
          <label class="check">
            <input class="toggle" type="checkbox" />
          </label>
          <span class="text"></span>
        </div>

        <div class="actions">
          <button class="btn icon" data-action="edit" type="button" title="Edit">Edit</button>
          <button class="btn icon danger" data-action="delete" type="button" title="Delete">Delete</button>
        </div>
      </div>

      <div class="progress-row" aria-label="Progress">
        <div class="progress-header">
          <span class="progress-title">Progress</span>
          <span class="progress-value" aria-live="polite">0%</span>
        </div>

        <div class="progress-track" aria-hidden="true">
          <div class="progress-fill" style="width:0%"></div>
        </div>

        <input class="progress-input" type="range" min="0" max="100" step="1" value="0" aria-label="Set progress" />
      </div>

      <input class="edit" type="text" maxlength="1000" />

      <div class="subtasks-row">
        <ul class="subtasks-list"></ul>

        <form class="subtask-form" autocomplete="off">
          <label class="sr-only" for="subtask-input">New subtask</label>
          <input class="subtask-input" type="text" placeholder="Add a subtask..." maxlength="1000" />
          <button class="btn" type="submit">Add</button>
        </form>
      </div>
    </li>
  </template>

  <script src="app.js" defer></script>
</body>
</html>
